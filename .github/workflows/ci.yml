name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mobs
          POSTGRES_PASSWORD: mobs
          POSTGRES_DB: mobs_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mobs -d mobs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Dashboard integration tests and the dashboard build read these; none is a real secret.
      TEST_DATABASE_URL: postgres://mobs:mobs@localhost:5433/mobs_test
      DATABASE_URL: postgres://mobs:mobs@localhost:5433/mobs_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android:
    name: Android SDK module compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Generate the example app's Android project
        working-directory: apps/example
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - name: Compile the SDK's Kotlin sources
        working-directory: apps/example/android
        run: ./gradlew :mobile-observability-react-native:compileReleaseKotlin --no-daemon --console=plain
