services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobs
      POSTGRES_PASSWORD: mobs
      POSTGRES_DB: mobs
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobs -d mobs"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
