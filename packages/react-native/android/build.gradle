plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mobileobservability'
version = '0.1.1'

android {
  namespace "expo.modules.mobileobservability"
  defaultConfig {
    versionCode 2
    versionName '0.1.1'
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
